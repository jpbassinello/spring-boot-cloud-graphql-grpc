name: sbcgg-prod

# Single-host production stack: Traefik terminates TLS and routes to the services by hostname,
# everything else stays on the internal compose network.
#
# This file is STANDALONE — it does not `include:` ../shared/docker-compose.yml, because the
# infrastructure containers need production settings (real passwords, tuned Postgres, named
# volumes, no host port publishing). The cost is that postgres/keycloak/redis/consul/lgtm are
# defined twice; bumping an image tag in shared/ or dev/ without bumping it here is silent
# version drift in production. /upgrade-deps treats this file as a separate source of tags.
#
# Images come from the registry, tagged with the deployed commit SHA (see
# .github/workflows/publish.yml), so every service moves together and a stale container can
# never linger. IMAGE_TAG is written into the host .env by the deploy job.

services:

  traefik:
    image: traefik:v3.7.13
    container_name: sbcgg-traefik
    restart: unless-stopped
    mem_swappiness: 0
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # Access logs to stdout (CLF) so every request that actually reaches the origin is
      # visible via `docker logs sbcgg-traefik` — disambiguates "blocked upstream (CDN/WAF)"
      # from "reached Traefik but not the app".
      - "--accesslog=true"
      # Let's Encrypt via HTTP-01. Routers opt in with tls.certresolver=le; a router with a
      # bare tls=true is served Traefik's default certificate instead (see traefik/dynamic.yml
      # for when that is what you want).
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/certs:ro
      - letsencrypt:/letsencrypt
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.5'
        reservations:
          memory: 48M

  postgres:
    image: postgres:18.6-alpine3.24
    container_name: sbcgg-postgres
    restart: unless-stopped
    mem_swappiness: 0
    command: >
      postgres
      -c shared_buffers=192MB
      -c effective_cache_size=384MB
      -c maintenance_work_mem=48MB
      -c work_mem=4MB
      -c max_connections=100
    ports:
      # Loopback only: for `psql` over an SSH tunnel, never reachable from the internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: "UTC"
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/<major>/docker, and the entrypoint
      # refuses to start when it finds an unused mount at the legacy /var/lib/postgresql/data
      # (it would look persisted while every restart threw the data away). Mount the parent so
      # the major-version subdirectory lives inside the volume and pg_upgrade --link stays
      # possible. See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
      - ../configs/postgres:/docker-entrypoint-initdb.d:z
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: sbcgg-keycloak
    restart: unless-stopped
    mem_swappiness: 0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-keycloak}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      TZ: UTC
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: [ "start", "--import-realm", "--http-enabled=true", "--hostname-strict=false" ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOSTNAME}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.tls.certresolver=le"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    healthcheck:
      # The management port (9000) is not exposed and the image has no curl, so probe it over
      # a bash /dev/tcp socket.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000; \
                echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; \
                if timeout 3 cat <&3 | grep -m 1 'UP'; then \
                  exec 3<&-; exec 3>&-; exit 0; \
                else \
                  exec 3<&-; exec 3>&-; exit 1; \
                fi"
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ../configs/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M

  redis:
    image: redis:8.10.1-alpine3.23
    command: redis-server --requirepass ${REDIS_PASSWORD} --loglevel warning
    container_name: sbcgg-redis
    restart: unless-stopped
    mem_swappiness: 0
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.5'
        reservations:
          memory: 48M

  consul:
    image: hashicorp/consul:1.22.7
    command: "agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui -data-dir=/consul/data"
    container_name: sbcgg-consul
    restart: unless-stopped
    mem_swappiness: 0
    volumes:
      - consul-data:/consul/data
      - ../configs/consul/yaml:/tmp/yaml:Z
      - ../configs/consul/init-prod.sh:/tmp/init-consul.sh:Z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.consul.rule=Host(`${CONSUL_HOSTNAME}`)"
      - "traefik.http.routers.consul.entrypoints=websecure"
      - "traefik.http.routers.consul.tls=true"
      - "traefik.http.routers.consul.tls.certresolver=le"
      - "traefik.http.routers.consul.middlewares=admin-auth"
      - "traefik.http.services.consul.loadbalancer.server.port=8500"
      - "traefik.http.middlewares.admin-auth.basicauth.users=${ADMIN_BASIC_AUTH}"
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 5s
      timeout: 5s
      retries: 5
    post_start:
      - command: [ "/bin/sh", "/tmp/init-consul.sh" ]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M

  lgtm:
    image: grafana/otel-lgtm:0.33.0
    container_name: sbcgg-lgtm
    restart: unless-stopped
    mem_swappiness: 0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOSTNAME}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.routers.grafana.middlewares=admin-auth"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - lgtm-data:/data
    environment:
      # Loki ships with no compactor and no limits_config, which means retention is both
      # infinite and unenforceable -- the stack grows until the disk fills, and a full WAL disk
      # makes Loki 503 every log push (this silently killed log ingestion in a fork of this
      # project). Passing flags rather than mounting a replacement loki-config.yaml keeps the
      # image's own config authoritative across upgrades; the compactor needs a working dir and
      # a delete-request store before -store.retention is honoured.
      - LOKI_EXTRA_ARGS=-compactor.working-directory=/data/loki/compactor -compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=336h
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  users:
    image: ${REGISTRY:-ghcr.io/jpbassinello}/sbcgg/users:${IMAGE_TAG:-latest}
    container_name: sbcgg-users
    restart: unless-stopped
    mem_swappiness: 0
    environment:
      - SPRING_PROFILES_ACTIVE=prod-docker
      - BPL_JVM_THREAD_COUNT=50
      # Resolved by the Consul KV values seeded from configs/consul/yaml/users-service.yaml.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-keycloak}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      consul:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/layers/paketo-buildpacks_health-checker/thc/bin/thc", "--port", "8080", "--path", "/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
        reservations:
          memory: 256M

  messages:
    image: ${REGISTRY:-ghcr.io/jpbassinello}/sbcgg/messages:${IMAGE_TAG:-latest}
    container_name: sbcgg-messages
    restart: unless-stopped
    mem_swappiness: 0
    environment:
      - SPRING_PROFILES_ACTIVE=prod-docker
      - BPL_JVM_THREAD_COUNT=50
      # Resolved by the Consul KV values seeded from configs/consul/yaml/messages-service.yaml.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      consul:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/layers/paketo-buildpacks_health-checker/thc/bin/thc", "--port", "8080", "--path", "/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
        reservations:
          memory: 256M

  gateway:
    image: ${REGISTRY:-ghcr.io/jpbassinello}/sbcgg/gateway:${IMAGE_TAG:-latest}
    container_name: sbcgg-gateway
    restart: unless-stopped
    mem_swappiness: 0
    environment:
      - SPRING_PROFILES_ACTIVE=prod-docker
      - BPL_JVM_THREAD_COUNT=50
      # Resolved by the Consul KV value seeded from configs/consul/yaml/graphql-gateway.yaml.
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${GATEWAY_HOSTNAME}`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls=true"
      - "traefik.http.routers.gateway.tls.certresolver=le"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      consul:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/layers/paketo-buildpacks_health-checker/thc/bin/thc", "--port", "8080", "--path", "/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
        reservations:
          memory: 256M

volumes:
  postgres-data:
  redis-data:
  consul-data:
  lgtm-data:
  letsencrypt:
